name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - run: npm run test:ui
  editor-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18
      - run: bun install --frozen-lockfile
        working-directory: vendor/opencut-classic
      - run: node scripts/build-content.mjs
        working-directory: vendor/opencut-classic/apps/web
      - run: bun x tsc --noEmit
        working-directory: vendor/opencut-classic/apps/web
